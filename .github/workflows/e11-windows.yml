name: e11 Remote Play - Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-win_x64:
    name: Build e11 Remote Play (Windows x64)
    runs-on: windows-latest
    env:
      CC: clang-cl.exe
      CXX: clang-cl.exe
      VULKAN_SDK: C:\VulkanSDK\
      triplet: x64-windows
      vcpkg_baseline: 42bb0d9e8d4cf33485afb9ee2229150f79f61a1f
      dep_folder: deps
      libplacebo_tag: v7.387.0
      sdl2_compat_tag: 2.32.74

    defaults:
      run:
        shell: powershell

    steps:
      - name: Get original source (pinned)
        uses: actions/checkout@v7
        with:
          repository: streetpea/chiaki-ng
          ref: 43728af2e639fecb8a7af1cd68c29820a40de973
          submodules: 'recursive'
          fetch-depth: 0

      - name: Get e11 changes
        uses: actions/checkout@v7
        with:
          path: e11src

      - name: Apply e11 changes
        shell: bash
        run: |
          git apply --whitespace=nowarn e11src/e11-windows.patch
          git status --short | head -50

      - name: Set vcpkg installed dir
        run: |
          echo "VCPKG_INSTALLED_DIR=${{ github.workspace }}\build\vcpkg_installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Vulkan
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ver = (Invoke-WebRequest -UseBasicParsing -Uri "https://vulkan.lunarg.com/sdk/latest.json" | ConvertFrom-Json).windows
          echo Version $ver
          Invoke-WebRequest -UseBasicParsing -Uri "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe" -OutFile VulkanSDK.exe
          echo Downloaded
          .\VulkanSDK.exe --root ${{ env.VULKAN_SDK }}  --accept-licenses --default-answer --confirm-command install

      - name: Set up Ninja
        run: choco install ninja

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v2
        with:
          version: 18

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          setup-python: false
          # aqtinstall 3.3.0 (latest release) can't read Qt 6.12's new repository layout:
          # "Failed to locate XML data for Qt version '6.12.1'". Fixed upstream in PR #1048,
          # not released yet, so install it from this pinned master commit.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@4c759852b1108cc801d8e24979136b895b5155d4'
          cache: true
          # 6.12.0, not 6.12.*: Qt WebEngine (PSN sign-in) is only published for 6.12.0 so far,
          # and the Mac build also uses 6.12.0.
          version: "6.12.0"
          host: 'windows'
          target: 'desktop'
          modules: 'qtwebengine qtpositioning qtwebchannel qtwebsockets qtserialport'

      - name: Install pip dependencies
        run: |
          ${{ env.pythonLocation }}\python.exe -m pip install --upgrade pip
          ${{ env.pythonLocation }}\python.exe -m pip install --upgrade setuptools wheel
          ${{ env.pythonLocation }}\python.exe -m pip install --user --upgrade scons protobuf grpcio-tools pyinstaller
          ${{ env.pythonLocation }}\python.exe -m pip install --user --upgrade meson
          ${{ env.pythonLocation }}\python.exe -c 'import google.protobuf; print(google.protobuf.__file__)'

      - name: Setup ffmpeg
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip" -OutFile ".\ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip"
          Expand-Archive -LiteralPath "ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip" -DestinationPath "."
          Rename-Item "ffmpeg-n9.0-latest-win64-gpl-shared-9.0" "${{ env.dep_folder }}"

      - name: Setup sdl2-compat
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri https://github.com/libsdl-org/sdl2-compat/releases/download/release-${{ env.sdl2_compat_tag }}/sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip -OutFile sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip
          Expand-Archive -Force -LiteralPath "sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip" -DestinationPath ".\sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64"
          Get-ChildItem -Path ".\sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64\*" -Include "*.dll" | Copy-Item -Force -Destination "${{ env.dep_folder }}\bin"

      - name: Build SPIRV-Cross
        run: |
          git clone https://github.com/KhronosGroup/SPIRV-Cross.git
          cd SPIRV-Cross
          cmake `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\${{ env.dep_folder }}" `
          -DSPIRV_CROSS_SHARED=ON `
          -S . `
          -B build `
          -G Ninja
          cmake --build build --config Release
          cmake --install build

      - name: Setup shaderc (from the Vulkan SDK)
        # Google's shaderc download links (vs2019, and vs2022 -> install.tgz) now return
        # "NoSuchKey", so take shaderc from the Vulkan SDK installed above instead.
        run: |
          $sdk = "${{ env.VULKAN_SDK }}"
          $dep = "${{ github.workspace }}\${{ env.dep_folder }}"
          New-Item -ItemType Directory -Force "$dep\bin","$dep\lib\pkgconfig","$dep\include" | Out-Null
          $dll = Get-ChildItem -Path $sdk -Recurse -Filter shaderc_shared.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          $lib = Get-ChildItem -Path $sdk -Recurse -Filter shaderc_shared.lib -ErrorAction SilentlyContinue | Select-Object -First 1
          $inc = Get-ChildItem -Path $sdk -Recurse -Directory -Filter shaderc -ErrorAction SilentlyContinue | Where-Object { Test-Path (Join-Path $_.FullName "shaderc.h") } | Select-Object -First 1
          if (-not $dll -or -not $lib -or -not $inc) {
            Get-ChildItem $sdk | Select-Object Name
            Get-ChildItem (Join-Path $sdk "Lib") -ErrorAction SilentlyContinue | Select-Object Name
            Get-ChildItem (Join-Path $sdk "Bin") -ErrorAction SilentlyContinue | Select-Object Name
            throw "shaderc not found in the Vulkan SDK"
          }
          Copy-Item $dll.FullName "$dep\bin\" -Force
          Copy-Item $lib.FullName "$dep\lib\" -Force
          Copy-Item $inc.FullName "$dep\include\" -Recurse -Force
          $prefix = $dep -replace '\\','/'
          $pc = "prefix=$prefix`nlibdir=`${prefix}/lib`nincludedir=`${prefix}/include`n`nName: shaderc`nDescription: shaderc (from the Vulkan SDK)`nVersion: 2025.1`nLibs: -L`${libdir} -lshaderc_shared`nCflags: -I`${includedir}`n"
          Set-Content -Path "$dep\lib\pkgconfig\shaderc.pc" -Value $pc -Encoding ascii
          Write-Host "shaderc: $($dll.FullName) / $($lib.FullName) / $($inc.FullName)"
          Get-Content "$dep\lib\pkgconfig\shaderc.pc"

      - name: Make build directory
        run: |
          mkdir build

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.vcpkg_baseline }}
          runVcpkgInstall: true
          vcpkgJsonGlob: "vcpkg.json"

      - name: Build libplacebo
        run: |
          git clone --recursive https://github.com/haasn/libplacebo.git
          cd libplacebo
          git checkout --recurse-submodules ${{ env.libplacebo_tag }}
          meson setup `
          --prefix "${{ github.workspace }}\${{ env.dep_folder }}" `
          --native-file ../meson.ini `
          "--pkg-config-path=['${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\lib\pkgconfig','${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\share\pkgconfig','${{ github.workspace }}\${{ env.dep_folder }}\lib\pkgconfig']" `
          "--cmake-prefix-path=['${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}', '${{ env.VULKAN_SDK }}', '${{ github.workspace }}\${{ env.dep_folder }}']" `
          -Dc_args="/I ${{ env.VULKAN_SDK }}Include" `
          -Dcpp_args="/I ${{ env.VULKAN_SDK }}Include" `
          -Dc_link_args="/LIBPATH:${{ env.VULKAN_SDK }}Lib" `
          -Dcpp_link_args="/LIBPATH:${{ env.VULKAN_SDK }}Lib" `
          -Ddemos=false `
          ./build
          ninja -C./build
          ninja -C./build install

      - name: Apply Patches
        run: |
          git apply --ignore-whitespace --verbose --directory=third-party/gf-complete/ scripts/windows-vc/gf-complete.patch

      - name: Configure chiaki-ng
        run: |
          cmake `
          -S . `
          -B build `
          -G Ninja `
          -DCMAKE_TOOLCHAIN_FILE:STRING="vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE `
          -DCMAKE_BUILD_TYPE=Release `
          -DCHIAKI_ENABLE_CLI=OFF `
          -DCHIAKI_GUI_ENABLE_SDL_GAMECONTROLLER=ON `
          -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF `
          -DPYTHON_EXECUTABLE="${{ env.pythonLocation }}\python.exe" `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}\${{ env.dep_folder }};${{ env.VULKAN_SDK }}"

      - name: Build chiaki-ng
        run: |
          cmake --build build --config Release --clean-first --target chiaki

      - name: Prepare Qt deployment package
        run: |
          $D = "e11 Remote Play"
          mkdir $D
          cp build\gui\e11remoteplay.exe $D
          cp build\third-party\cpp-steam-tools\cpp-steam-tools.dll $D
          cp scripts\qtwebengine_import.qml gui\src\qml\
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\libcrypto-*-x64.dll" $D
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\libssl-*-x64.dll" $D
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\SDL2.dll" $D
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\SDL3.dll" $D
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\hidapi.dll" $D
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\fftw3.dll" $D
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\opus.dll" $D
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\libspeexdsp.dll" $D
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\lcms2.dll" $D
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\miniupnpc.dll" $D
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\json-c.dll" $D
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\swresample-*.dll" $D
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\avcodec-*.dll" $D
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\avutil-*.dll" $D
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\avformat-*.dll" $D
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\libplacebo-*.dll" $D
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\shaderc_shared.dll" $D
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\spirv-cross-c-shared.dll" $D
          windeployqt.exe --no-translations --qmldir=gui\src\qml --release "$D\e11remoteplay.exe"

      - name: Package e11 Remote Play
        run: |
          Compress-Archive "e11 Remote Play" "e11-Remote-Play-Windows-x64.zip"

      - name: Upload e11 Remote Play (Windows)
        uses: actions/upload-artifact@v7
        with:
          name: e11-Remote-Play-Windows-x64
          path: e11-Remote-Play-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
